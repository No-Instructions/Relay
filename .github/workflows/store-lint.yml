name: Store Lint

# Nightly run of the Obsidian community-store lint (eslint-plugin-obsidianmd)
# against main, with the store toolchain installed fresh each night.
# Error-severity findings fail the job; warnings are inventory only.
#
# The work happens in .github/ci/store-lint.sh, which runs the same way from
# a workstation (from the repository root).

on:
  schedule:
    # 06:43 UTC nightly — an off-minute slot clear of the 08:29 burn-in,
    # and top-of-hour Actions congestion.
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-lint:
    name: community store lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'

      - name: Run store lint
        run: .github/ci/store-lint.sh "$RUNNER_TEMP/store-lint"

      - name: Summarize
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/ci/store-lint-summary.js`)(
              { core }, { results: `${process.env.RUNNER_TEMP}/store-lint/results.json` });
