name: Bake Windows E2E image

# Manually dispatched: bakes the Windows E2E image (relay-e2e-windows family)
# that the Windows multi-node lane boots.
#
# The work happens in .github/ci/bake-windows-image.sh, which runs the same
# way from a workstation; this file only maps inputs onto it.

on:
  workflow_dispatch:
    inputs:
      harness_ref:
        description: 'relay-harness ref providing infra/ setup scripts'
        required: false
        default: 'origin/main'
      image_name:
        description: 'Image name to create (default relay-e2e-windows-YYYYMMDD)'
        required: false
        default: ''
      keep_vm:
        description: 'Keep the build VM instead of deleting it (debugging)'
        required: false
        default: 'false'

env:
  GCP_PROJECT: tactile-timer-426817-t6
  VM_ZONE: ${{ vars.CI_VM_ZONE || 'us-west2-a' }}

permissions:
  contents: read

jobs:
  bake:
    name: bake-windows-image
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/ci
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TACTILE }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Bake the image
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          HARNESS_REF: ${{ inputs.harness_ref }}
          IMAGE_NAME: ${{ inputs.image_name }}
          KEEP_VM_FLAG: ${{ inputs.keep_vm == 'true' && '--keep-vm' || '' }}
        run: >-
          .github/ci/bake-windows-image.sh run
          --harness-ref "$HARNESS_REF" --image-name "$IMAGE_NAME" $KEEP_VM_FLAG

      - name: Delete the build VM
        if: always()
        run: .github/ci/bake-windows-image.sh cleanup
