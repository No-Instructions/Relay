name: E2E scripted test plans

# The push gate: every push to main and every release tag runs the default
# scripted plan set on the push lane's own VM and staging users (slots 3-8,
# plus the storage pair the suite claims itself). A dispatch can run it for
# any ref, plan list, or harness.
#
# The work happens in .github/ci/lane.sh (fixed-VM mode), which runs the same
# way from a workstation; this file only maps inputs onto it.

on:
  push:
    branches: [main]
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to test (e.g. origin/main, origin/feature-x, a tag, or a SHA)'
        required: true
        default: 'origin/main'
      tests:
        description: 'Optional comma-separated scripted test ids (e.g. tp000,tp006,tp031)'
        required: false
        default: ''
      harness_ref:
        description: 'relay-harness ref to run (e.g. origin/main, a branch, or a SHA)'
        required: false
        default: 'origin/main'
      obsidian_version:
        description: 'Obsidian AppImage version to install (e.g. 1.13.4)'
        required: false
        default: '1.13.4'

# One run at a time: the gate owns one VM and one set of staging users.
concurrency:
  group: e2e-test-plans-linux
  cancel-in-progress: false

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  VM_ZONE: ${{ secrets.GCP_VM_ZONE }}
  CI_R2_BUCKET: system3-ci
  CI_R2_ENDPOINT: ${{ secrets.CI_R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.CI_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_R2_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  scripted-test:
    name: scripted-test (scripted-all)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/ci
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Run the plans on the push-lane VM
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          CI_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          VM: ${{ format('{0}-tp-all', secrets.GCP_VM_NAME) }}
          # A dispatch tests its ref; a tag push its tag; a branch push the
          # exact triggering commit, so re-runs reproduce the original checkout.
          REF: ${{ inputs.ref || (github.ref_type == 'tag' && format('refs/tags/{0}', github.ref_name)) || github.sha }}
          HARNESS_REF: ${{ inputs.harness_ref || 'origin/main' }}
          TESTS: ${{ inputs.tests || 'default' }}
          OBSIDIAN_VERSION: ${{ inputs.obsidian_version || '1.13.4' }}
        run: >-
          .github/ci/lane.sh run --lane push --vm "$VM"
          --ref "$REF" --harness-ref "$HARNESS_REF" --tests "$TESTS"
          --exec-suffix all --free-slots 3,4,5,6,7,8
          --obsidian-version "$OBSIDIAN_VERSION"

      - name: Release the VM
        if: always()
        run: .github/ci/lane.sh cleanup

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: testplans-all-metadata
          path: |
            summary.json
            metadata.json
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/ci/summary.js`)(
              { github, context, core },
              { title: 'E2E scripted test plans (scripted-all)', checkName: 'scripted-test (scripted-all)' });
