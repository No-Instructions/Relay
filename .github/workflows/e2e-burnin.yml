name: E2E burn-in

# Nightly burn-in soak for graduation candidates. Slow, timing-sensitive, or
# render-heavy plans must prove flake-free here BEFORE they enter the per-push
# `scripted-all` suite. Each plan runs on its own leased pool VM (one matrix
# leg per plan) so a flake in one plan cannot contaminate another's verdict,
# and every night's per-plan pass/fail is appended to a persistent R2 ledger
# (s3://system3-ci/burnin/ledger.jsonl) so flake RATES accumulate across
# nights rather than resetting with each run's artifacts.
#
# `default` means the plans the suite manifest flags burnIn; a manual dispatch
# can pass an explicit comma-separated list, or change the ref or harness.
#
# The work happens in .github/ci/ (burnin-prepare.sh, lane.sh,
# burnin-aggregate.sh), which runs the same way from a workstation; this file
# only maps inputs onto it.

run-name: >-
  burn-in ${{ inputs.tests || 'default' }}
  @ ${{ inputs.ref || 'origin/main' }}

on:
  schedule:
    # 08:29 UTC nightly — an off-minute clear of the 09:17 platform-smoke cron
    # and the top-of-hour Actions congestion. Burn-in and the smokes draw from
    # disjoint fleets (pool VMs vs hosted runners), so they never contend.
    - cron: '29 8 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to soak (e.g. origin/main, a tag, or a SHA)'
        required: false
        default: 'origin/main'
      tests:
        description: 'Comma-separated plan ids to burn in (one pool VM each), or "default" for the suite manifest''s burn-in set'
        required: false
        default: 'default'
      harness_ref:
        description: 'relay-harness ref to run (e.g. origin/main, a branch, or a SHA)'
        required: false
        default: 'origin/main'
      obsidian_version:
        description: 'Obsidian AppImage version to install (e.g. 1.13.4)'
        required: false
        default: '1.13.4'

env:
  GCP_PROJECT: tactile-timer-426817-t6
  VM_ZONE: ${{ vars.CI_VM_ZONE || 'us-west2-a' }}
  VM_IMAGE_FAMILY: relay-e2e-base
  CI_R2_BUCKET: system3-ci
  CI_R2_ENDPOINT: ${{ secrets.CI_R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.CI_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_R2_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      product_sha: ${{ steps.pin.outputs.product_sha }}
      ref: ${{ steps.pin.outputs.ref }}
      suite_sha: ${{ steps.pin.outputs.suite_sha }}
      matrix: ${{ steps.pin.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/ci
          persist-credentials: false

      - name: Pin the product, the suite and the plan set
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          REF: ${{ inputs.ref }}
          TESTS: ${{ inputs.tests }}
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: .github/ci/burnin-prepare.sh --ref "$REF" --tests "$TESTS" --harness-ref "$HARNESS_REF"

  burnin:
    name: burnin (${{ matrix.plan }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      # Below the pool count, so other lanes keep headroom; legs beyond the
      # free pools wait for one.
      max-parallel: 6
      matrix:
        plan: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/ci
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TACTILE }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Run the plan on a leased VM
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          CI_SA_KEY: ${{ secrets.GCP_SA_KEY_TACTILE }}
          CI_LEASE_TAG: ${{ matrix.plan }}
          PRODUCT_SHA: ${{ needs.prepare.outputs.product_sha }}
          SUITE_SHA: ${{ needs.prepare.outputs.suite_sha }}
          PLAN: ${{ matrix.plan }}
          EXEC_SUFFIX: 'burnin-${{ matrix.plan }}-r${{ github.run_number }}'
          OBSIDIAN_VERSION: ${{ inputs.obsidian_version }}
          PUBLISH_PREFIX: 'github-runs/${{ github.run_id }}/attempt-${{ github.run_attempt }}/burnin/burnin-${{ matrix.plan }}'
        run: >-
          .github/ci/lane.sh run --lane bi
          --ref "$PRODUCT_SHA" --harness-ref "$SUITE_SHA" --tests "$PLAN"
          --exec-suffix "$EXEC_SUFFIX" --obsidian-version "$OBSIDIAN_VERSION"
          --publish-prefix "$PUBLISH_PREFIX"

      - name: Release the VM and pool
        if: always()
        run: .github/ci/lane.sh cleanup

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: testplans-burnin-${{ matrix.plan }}-metadata
          path: |
            summary.json
            metadata.json
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PLAN: ${{ matrix.plan }}
        with:
          script: |
            const plan = process.env.PLAN;
            await require(`${process.env.GITHUB_WORKSPACE}/.github/ci/summary.js`)(
              { github, context, core },
              { title: `E2E burn-in (${plan})`, checkName: `burnin (${plan})` });

  aggregate:
    name: aggregate
    needs: [prepare, burnin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/ci
          persist-credentials: false

      - name: Append tonight's verdicts to the ledger
        env:
          PRODUCT_SHA: ${{ needs.prepare.outputs.product_sha }}
          SOAK_REF: ${{ needs.prepare.outputs.ref }}
        run: .github/ci/burnin-aggregate.sh
