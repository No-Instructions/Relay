name: E2E parallel lane

# Manually dispatched E2E lane. Each run leases a staging-user pool, runs the
# selected plans on its own VM, and releases the pool. Runs never share
# staging users; a dispatch that finds every pool held waits for one.
#
# The work happens in .github/ci/lane.sh, which runs the same way from a
# workstation (see its header); this file only maps inputs onto it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to test (e.g. origin/main, origin/feature-x, a tag, or a SHA)'
        required: true
        default: 'origin/main'
      tests:
        description: 'Comma-separated scripted test ids (e.g. tp000,tp006,tp031). Each two-user pool carries its own storage-quota relay, so storage tests are safe in any run.'
        required: true
        default: 'tp000'
      harness_ref:
        description: 'relay-harness ref to run (e.g. origin/main, a branch, or a SHA)'
        required: false
        default: 'origin/main'
      profile_flags:
        description: 'Optional profile flag overrides (e.g. enableDraftMode=true)'
        required: false
        default: ''
      obsidian_version:
        description: 'Obsidian AppImage version to install (e.g. 1.13.4)'
        required: false
        default: '1.13.4'
      obsidian_url:
        description: 'Optional direct URL to an Obsidian AppImage (e.g. an installer beta); takes precedence over obsidian_version. Must be a fixed per-build link, not a moving alias.'
        required: false
        default: ''

env:
  GCP_PROJECT: tactile-timer-426817-t6
  VM_ZONE: ${{ vars.CI_VM_ZONE || 'us-west2-a' }}
  VM_IMAGE_FAMILY: relay-e2e-base
  CI_R2_BUCKET: system3-ci
  CI_R2_ENDPOINT: ${{ secrets.CI_R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.CI_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_R2_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  parallel-test:
    name: parallel-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/ci
          persist-credentials: false

      - name: Record the run manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          TESTS: ${{ inputs.tests }}
          HARNESS_REF: ${{ inputs.harness_ref }}
          PROFILE_FLAGS: ${{ inputs.profile_flags }}
        run: >-
          .github/ci/run-manifest.sh --ref "$REF" --tests "$TESTS"
          --harness-ref "$HARNESS_REF" --profile-flags "$PROFILE_FLAGS"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TACTILE }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Run the plans on a leased VM
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          CI_SA_KEY: ${{ secrets.GCP_SA_KEY_TACTILE }}
          PRODUCT_SHA: ${{ steps.manifest.outputs.product_sha }}
          HARNESS_REF: ${{ inputs.harness_ref || 'origin/main' }}
          TESTS: ${{ inputs.tests }}
          EXEC_SUFFIX: '{pool}-r${{ github.run_number }}'
          PROFILE_FLAGS: ${{ inputs.profile_flags }}
          OBSIDIAN_VERSION: ${{ inputs.obsidian_version }}
          OBSIDIAN_URL: ${{ inputs.obsidian_url }}
        run: >-
          .github/ci/lane.sh run --lane tt
          --ref "$PRODUCT_SHA" --harness-ref "$HARNESS_REF" --tests "$TESTS"
          --exec-suffix "$EXEC_SUFFIX" --profile-flags "$PROFILE_FLAGS"
          --obsidian-version "$OBSIDIAN_VERSION" --obsidian-url "$OBSIDIAN_URL"

      - name: Release the VM and pool
        if: always()
        run: .github/ci/lane.sh cleanup

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: testplans-lane-metadata
          path: |
            summary.json
            metadata.json
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/ci/summary.js`)(
              { github, context, core }, { title: `E2E parallel lane (${process.env.CI_POOL || 'parallel'})` });
