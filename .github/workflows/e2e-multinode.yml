name: E2E multi-node

# Runs scripted test plans through the multi-node orchestrator
# (relay-harness scripts/orchestrate_test_plans.py). Topology is input data:
# `slots` lists each slot's platform, and both slots run colocated on one
# host. Supported: linux,linux (a leased pool VM), windows,windows (a VM) and
# macos,macos (the hosted macOS runner the job itself runs on).
#
# The work happens in .github/ci/lane.sh (Linux), lane-windows.sh (Windows)
# and lane-macos.sh (macOS), which run the same way from a workstation; this
# file only maps inputs onto them.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Product ref to test (e.g. origin/main, a branch, or a SHA)'
        required: true
        default: 'origin/main'
      plans:
        description: "Comma-separated plan ids, or 'default' for the ciDefault set"
        required: false
        default: 'default'
      harness_ref:
        description: 'relay-harness ref (e.g. origin/main, a branch, or a SHA)'
        required: false
        default: 'origin/main'
      slots:
        description: 'Slot platforms: linux,linux, windows,windows or macos,macos'
        required: false
        default: 'linux,linux'

env:
  GCP_PROJECT: tactile-timer-426817-t6
  VM_ZONE: ${{ vars.CI_VM_ZONE || 'us-west2-a' }}
  VM_IMAGE_FAMILY: relay-e2e-base
  CI_R2_BUCKET: system3-ci
  CI_R2_ENDPOINT: ${{ secrets.CI_R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.CI_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_R2_SECRET_ACCESS_KEY }}

permissions:
  contents: read

jobs:
  multinode:
    name: multinode
    # The macOS slots run on the job's own runner; the others on a VM that an
    # Ubuntu runner drives.
    runs-on: ${{ inputs.slots == 'macos,macos' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      checks: write
      contents: read
    steps:
      - name: Validate topology
        env:
          SLOTS: ${{ inputs.slots }}
        run: |
          case "$SLOTS" in
            linux,linux|windows,windows|macos,macos) echo "topology: $SLOTS" ;;
            *) echo "::error::unsupported slot list: $SLOTS"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/ci
          persist-credentials: false

      - name: Record the run manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          PLANS: ${{ inputs.plans }}
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: .github/ci/run-manifest.sh --ref "$REF" --tests "$PLANS" --harness-ref "$HARNESS_REF"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: inputs.slots != 'macos,macos'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TACTILE }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        if: inputs.slots != 'macos,macos'

      - name: Run the plans on a leased Linux VM
        if: inputs.slots == 'linux,linux'
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          CI_SA_KEY: ${{ secrets.GCP_SA_KEY_TACTILE }}
          PRODUCT_SHA: ${{ steps.manifest.outputs.product_sha }}
          HARNESS_REF: ${{ inputs.harness_ref || 'origin/main' }}
          PLANS: ${{ inputs.plans }}
          EXEC_SUFFIX: 'mn-{pool}-r${{ github.run_number }}'
        run: >-
          .github/ci/lane.sh run --lane mn
          --ref "$PRODUCT_SHA" --harness-ref "$HARNESS_REF" --tests "$PLANS"
          --exec-suffix "$EXEC_SUFFIX"

      - name: Run the plans on a Windows VM
        if: inputs.slots == 'windows,windows'
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          PRODUCT_SHA: ${{ steps.manifest.outputs.product_sha }}
          HARNESS_REF: ${{ inputs.harness_ref || 'origin/main' }}
          PLANS: ${{ inputs.plans }}
          EXEC_SUFFIX: 'mn-w-r${{ github.run_number }}'
        run: >-
          .github/ci/lane-windows.sh run
          --ref "$PRODUCT_SHA" --harness-ref "$HARNESS_REF" --tests "$PLANS"
          --exec-suffix "$EXEC_SUFFIX"

      - name: Run the plans on this macOS runner
        if: inputs.slots == 'macos,macos'
        env:
          HARNESS_DEPLOY_KEY: ${{ secrets.HARNESS_DEPLOY_KEY }}
          PRODUCT_SHA: ${{ steps.manifest.outputs.product_sha }}
          HARNESS_REF: ${{ inputs.harness_ref || 'origin/main' }}
          PLANS: ${{ inputs.plans }}
          EXEC_SUFFIX: 'mn-m-{pool}-r${{ github.run_number }}'
        run: >-
          .github/ci/lane-macos.sh run
          --ref "$PRODUCT_SHA" --harness-ref "$HARNESS_REF" --tests "$PLANS"
          --exec-suffix "$EXEC_SUFFIX"

      - name: Release the host and pool
        if: always()
        env:
          SLOTS: ${{ inputs.slots }}
        run: |
          case "$SLOTS" in
            windows,windows) .github/ci/lane-windows.sh cleanup ;;
            macos,macos) .github/ci/lane-macos.sh cleanup ;;
            *) .github/ci/lane.sh cleanup ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: testplans-mn-metadata
          path: |
            summary.json
            metadata.json
          if-no-files-found: ignore

      - name: Summarize
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/ci/summary.js`)(
              { github, context, core },
              { title: 'E2E scripted test plans (mn)', checkName: 'scripted-test (mn)' });
