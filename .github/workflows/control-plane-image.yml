name: Control plane image

# Builds control-plane/. Pull requests only build; main pushes
# ghcr.io/inakimalerba/relay-control-plane tagged with the commit sha and latest.
# Infra pins the sha.

on:
  push:
    branches: [main]
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-image.yml'
  pull_request:
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: control-plane
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/inakimalerba/relay-control-plane:${{ github.sha }}
          ghcr.io/inakimalerba/relay-control-plane:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
