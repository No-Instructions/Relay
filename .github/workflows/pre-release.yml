name: Beta Releases

# A tag that differs from manifest.json's version publishes a prerelease
# whose manifest carries the tag as its version.
# Tag and version handling lives in .github/ci/release.sh.

on:
  push:
    tags:
    - '*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Check if tag does not match manifest version
      id: check
      run: .github/ci/release.sh check beta "$GITHUB_REF_NAME"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.x'
    - run: npm ci
    - run: npm run beta
    - name: Set release artifact manifest version
      run: .github/ci/release.sh set-version "$GITHUB_REF_NAME"
    - name: Generate artifact attestations
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
      with:
        subject-path: |
          main.js
          styles.css
          manifest.json
    - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        artifacts: "main.js,styles.css,manifest.json"
        immutableCreate: true
        prerelease: true
